<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <!-- Accent Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatChip1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.8deg); }
      }
      @keyframes floatChip2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-0.8deg); }
      }
      @keyframes pulseNodes {
        0%, 100% { opacity: 0.25; transform: scale(0.95); }
        50% { opacity: 0.9; transform: scale(1.1); }
      }
      @keyframes sparsePulse {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.15; }
        50% { stroke-dashoffset: 40; opacity: 0.85; }
      }
      @keyframes activePulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .chip-anim-1 { animation: floatChip1 7s ease-in-out infinite; transform-origin: center; }
      .chip-anim-2 { animation: floatChip2 6s ease-in-out infinite; transform-origin: center; }
      .node-pulse { animation: pulseNodes 4s ease-in-out infinite; transform-origin: center; }
      .line-sparse { animation: sparsePulse 5s linear infinite; }
      .light-pulse { animation: activePulse 3s ease-in-out infinite; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.3px;
        fill: #94A3B8;
      }
      .chip-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="90" r="160" fill="url(#glow-cyan)" />
  <circle cx="740" cy="230" r="180" fill="url(#glow-purple)" />

  <!-- Outer Cyber Border -->
  <rect x="1.5" y="1.5" width="897" height="317" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="1.5" y="1.5" width="897" height="317" rx="15" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="120 780" class="line-sparse" />

  <!-- Sparsity Matrix / Neural Web Graphic (Subtle Dynamic Background) -->
  <g opacity="0.45">
    <!-- Matrix Grid Nodes (Dense -> Pruned Sparsity visualization) -->
    <!-- Column 1 -->
    <circle cx="90" cy="70" r="4" fill="#00F0FF" class="node-pulse" style="animation-delay: 0.2s;" />
    <circle cx="90" cy="140" r="2.5" fill="#64748B" opacity="0.3" />
    <circle cx="90" cy="210" r="4" fill="#A78BFA" class="node-pulse" style="animation-delay: 1.1s;" />
    <circle cx="90" cy="270" r="2.5" fill="#64748B" opacity="0.3" />

    <!-- Column 2 -->
    <circle cx="210" cy="50" r="2.5" fill="#64748B" opacity="0.25" />
    <circle cx="210" cy="120" r="5" fill="#38BDF8" class="node-pulse" style="animation-delay: 0.7s;" />
    <circle cx="210" cy="240" r="4.5" fill="#818CF8" class="node-pulse" style="animation-delay: 1.5s;" />

    <!-- Column 3 -->
    <circle cx="700" cy="60" r="4" fill="#A78BFA" class="node-pulse" style="animation-delay: 0.5s;" />
    <circle cx="700" cy="150" r="2.5" fill="#64748B" opacity="0.2" />
    <circle cx="700" cy="250" r="5" fill="#00F0FF" class="node-pulse" style="animation-delay: 1.8s;" />

    <!-- Column 4 -->
    <circle cx="810" cy="80" r="3" fill="#64748B" opacity="0.3" />
    <circle cx="810" cy="160" r="4.5" fill="#38BDF8" class="node-pulse" style="animation-delay: 1.3s;" />
    <circle cx="810" cy="240" r="3.5" fill="#C084FC" class="node-pulse" style="animation-delay: 2.1s;" />

    <!-- Synaptic Connection Lines (Pruned & Quantized sparse lines) -->
    <line x1="90" y1="70" x2="210" y2="120" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 4" class="line-sparse" />
    <line x1="90" y1="210" x2="210" y2="240" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="5 5" class="line-sparse" />
    <line x1="700" y1="60" x2="810" y2="160" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 4" class="line-sparse" />
    <line x1="700" y1="250" x2="810" y2="240" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 6" class="line-sparse" />
  </g>

  <!-- Background Dynamic Tech Pills (Positioned safely behind/around main headline) -->
  <g class="chip-anim-1">
    <!-- Top-Right Tag: INT4 / FP8 Quantization -->
    <rect x="670" y="24" width="188" height="28" rx="14" fill="url(#chip-grad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="685" cy="38" r="4" fill="#38BDF8" class="light-pulse" />
    <text x="697" y="42" fill="#E2E8F0" class="chip-text">INT4 / FP8 QUANTIZATION</text>
  </g>

  <g class="chip-anim-2">
    <!-- Bottom-Left Tag: Structured Pruning -->
    <rect x="42" y="268" width="180" height="28" rx="14" fill="url(#chip-grad)" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="57" cy="282" r="4" fill="#A78BFA" class="light-pulse" />
    <text x="69" y="286" fill="#E2E8F0" class="chip-text">STRUCTURED PRUNING</text>
  </g>

  <g class="chip-anim-1">
    <!-- Bottom-Right Tag: Hardware AI Compilers -->
    <rect x="650" y="268" width="208" height="28" rx="14" fill="url(#chip-grad)" stroke="#34D399" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="665" cy="282" r="4" fill="#34D399" class="light-pulse" />
    <text x="677" y="286" fill="#E2E8F0" class="chip-text">HARDWARE AI COMPILERS</text>
  </g>

  <g class="chip-anim-2">
    <!-- Top-Left Tag: Zero-Latency Inference -->
    <rect x="42" y="24" width="198" height="28" rx="14" fill="url(#chip-grad)" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="57" cy="38" r="4" fill="#F43F5E" class="light-pulse" />
    <text x="69" y="42" fill="#E2E8F0" class="chip-text">INFERENCE ACCELERATION</text>
  </g>

  <!-- Central Foreground Content (Guaranteed 100% unobscured and crisp) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <rect x="330" y="62" width="240" height="26" rx="13" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
    <text x="450" y="79" text-anchor="middle" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2">⚡ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="450" y="132" text-anchor="middle" fill="url(#title-grad)" class="title-text" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">Awesome Model Optimization</text>
    <text x="450" y="172" text-anchor="middle" fill="#FFFFFF" class="title-text" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">&amp; Sparsification 🚀</text>

    <!-- Subtitle / Meta Description -->
    <text x="450" y="214" text-anchor="middle" class="subtitle-text">
      Production tools for Pruning, Quantization (FP8/INT4/AWQ), Distillation &amp; Edge Hardware Compilation
    </text>
    <text x="450" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#64748B" letter-spacing="0.2px">
      TensorRT • OpenVINO • ONNX Runtime • TVM • vLLM • llama.cpp • Qualcomm QNN • Apple Core ML
    </text>
  </g>
</svg>
